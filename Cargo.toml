[package]
name = "kakera-avg"
version = "0.10.0"
edition = "2024"
rust-version = "1.88"
default-run = "kakera-avg"
description = "A minimal, frame-based visual novel player"

[dependencies]
anyhow = "1.0"
getrandom = "=0.3.4"
directories = "6.0"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
roxmltree = "=0.21.1"
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "wav", "vorbis"] }
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
ttf-parser = "0.25"
unicode-segmentation = "1.12"
libloading = "=0.8.9"
# eframe without default features does not enable any native wgpu backend.
wgpu = { version = "27.0.1", default-features = false, features = ["dx12", "metal", "vulkan"] }
zstd = "0.13.3"
sha2 = "0.10.9"
notify = "8.2.0"
egui-winit = "=0.33.3"
winit = "=0.30.13"
raw-window-handle = "=0.6.2"
base64 = "=0.22.1"
chrono = { version = "=0.4.42", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.58.0", features = ["Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Dxgi_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Media_MediaFoundation", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Ole"] }

[profile.release]
strip = true

